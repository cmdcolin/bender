<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" width="1300" height="620" role="img" aria-label="Toy board block diagram"><style>
  text { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; fill: #1f2328 }
  .bg { fill: #ffffff }
  .box { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2 }
  .stub { stroke: #8c959f; stroke-width: 1 }
  .title { font-size: 13px; font-weight: 700 }
  .sub { fill: #656d76 }
  .pin { fill: #656d76; font-size: 10px }
  .net { fill: #0550ae }
  .rail { fill: #9a6700 }
  .head { font-size: 18px; font-weight: 700 }
  .arrow { stroke: #8c959f; stroke-width: 1.5; fill: none }
  .tip { fill: #8c959f }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3 }
    .bg { fill: #0d1117 }
    .box { fill: #161b22; stroke: #6e7681 }
    .stub { stroke: #6e7681 }
    .sub, .pin { fill: #8d96a0 }
    .net { fill: #79c0ff }
    .rail { fill: #e3b341 }
    .arrow { stroke: #6e7681 }
    .tip { fill: #6e7681 }
  }
</style><rect class="bg" width="100%" height="100%"/><text class="head" x="20" y="34">Toy board</text><path class="arrow" d="M230 99 L280 99"/><polygon class="tip" points="280,99 271,103 271,95"/><text class="net" x="255" y="93" text-anchor="middle">VCC</text><path class="arrow" d="M490 99 L540 99"/><polygon class="tip" points="540,99 531,103 531,95"/><text class="net" x="515" y="93" text-anchor="middle">MCLK</text><path class="arrow" d="M750 99 L800 99"/><polygon class="tip" points="800,99 791,103 791,95"/><text class="net" x="775" y="93" text-anchor="middle">STEP</text><path class="arrow" d="M1010 99 L1060 99"/><polygon class="tip" points="1060,99 1051,103 1051,95"/><text class="net" x="1035" y="93" text-anchor="middle">A0..4</text><path class="arrow" d="M1165 138 L1165 200"/><polygon class="tip" points="1165,200 1161,191 1169,191"/><text class="net" x="1171" y="173"></text><path class="arrow" d="M230 239 L540 239"/><polygon class="tip" points="540,239 531,243 531,235"/><text class="net" x="385" y="233" text-anchor="middle">KS0..3</text><path class="arrow" d="M750 239 L800 239"/><polygon class="tip" points="800,239 791,243 791,235"/><text class="net" x="775" y="233" text-anchor="middle">MC0..5</text><path class="arrow" d="M1010 239 L1060 239"/><polygon class="tip" points="1060,239 1051,243 1051,235"/><text class="net" x="1035" y="233" text-anchor="middle">LC0..3</text><path class="arrow" d="M1165 278 L1165 340"/><polygon class="tip" points="1165,340 1161,331 1169,331"/><text class="net" x="1171" y="313">PRE0..7</text><path class="arrow" d="M1060 379 L1010 379"/><polygon class="tip" points="1010,379 1019,375 1019,383"/><text class="net" x="1035" y="373" text-anchor="middle">TCP</text><path class="arrow" d="M800 379 L750 379"/><polygon class="tip" points="750,379 759,375 759,383"/><text class="net" x="775" y="373" text-anchor="middle">OCTCLK</text><path class="arrow" d="M540 379 L490 379"/><polygon class="tip" points="490,379 499,375 499,383"/><text class="net" x="515" y="373" text-anchor="middle"></text><path class="arrow" d="M385 418 L385 480"/><polygon class="tip" points="385,480 381,471 389,471"/><text class="net" x="391" y="453">ENV</text><path class="arrow" d="M490 519 L540 519"/><polygon class="tip" points="540,519 531,523 531,515"/><text class="net" x="515" y="513" text-anchor="middle">SIG</text><path class="arrow" d="M750 519 L800 519"/><polygon class="tip" points="800,519 791,523 791,515"/><text class="net" x="775" y="513" text-anchor="middle">SPKOUT</text><rect class="box" x="20" y="60" width="210" height="78" rx="6"/><text class="title" x="32" y="84">Supply</text><text class="sub" x="32" y="106">3 x AA or 5 V jack</text><text class="sub" x="32" y="122">starve rheostat -> VCC</text><rect class="box" x="280" y="60" width="210" height="78" rx="6"/><text class="title" x="292" y="84">RC clock  U1</text><text class="sub" x="292" y="106">74HC14 + clock pot</text><text class="sub" x="292" y="122">3.6 MHz  MCLK</text><rect class="box" x="540" y="60" width="210" height="78" rx="6"/><text class="title" x="552" y="84">Tempo  U2 U3</text><text class="sub" x="552" y="106">2 x 4040, 4 taps</text><text class="sub" x="552" y="122">/2^18 .. /2^21  -> STEP</text><rect class="box" x="800" y="60" width="210" height="78" rx="6"/><text class="title" x="812" y="84">Step counter  U4</text><text class="sub" x="812" y="106">5 bit, loop reset</text><text class="sub" x="812" y="122">STEP0..4</text><rect class="box" x="1060" y="60" width="210" height="78" rx="6"/><text class="title" x="1072" y="84">Tune ROM  U5</text><text class="sub" x="1072" y="106">AT28C64B, 32 steps</text><text class="sub" x="1072" y="122">bank DIP, cut jumpers</text><rect class="box" x="20" y="200" width="210" height="78" rx="6"/><text class="title" x="32" y="224">Keys  U6 U7 U8</text><text class="sub" x="32" y="246">12 keys, 2 x 148</text><text class="sub" x="32" y="262">priority: highest wins</text><rect class="box" x="540" y="200" width="210" height="78" rx="6"/><text class="title" x="552" y="224">Note select  U9 U10</text><text class="sub" x="552" y="246">key overrides tune</text><text class="sub" x="552" y="262">code = octave(2) semitone(4)</text><rect class="box" x="800" y="200" width="210" height="78" rx="6"/><text class="title" x="812" y="224">Latch  U15</text><text class="sub" x="812" y="246">transparent while G</text><text class="sub" x="812" y="262">holds across hold/rest</text><rect class="box" x="1060" y="200" width="210" height="78" rx="6"/><text class="title" x="1072" y="224">Semitone ROM  U16</text><text class="sub" x="1072" y="246">AT28C64B</text><text class="sub" x="1072" y="262">code -> 8 bit preload</text><rect class="box" x="1060" y="340" width="210" height="78" rx="6"/><text class="title" x="1072" y="364">Divider  U21 U22 U23</text><text class="sub" x="1072" y="386">2 x 161 reload to TC</text><text class="sub" x="1072" y="402">f = MCLK / N, N 136..256</text><rect class="box" x="800" y="340" width="210" height="78" rx="6"/><text class="title" x="812" y="364">Octave  U18 U17</text><text class="sub" x="812" y="386">/8 /4 /2 /1 tap</text><text class="sub" x="812" y="402">picked by LC4 LC5</text><rect class="box" x="540" y="340" width="210" height="78" rx="6"/><text class="title" x="552" y="364">Tone  U18 U19 U20</text><text class="sub" x="552" y="386">/16 then AND taps</text><text class="sub" x="552" y="402">50, 25, 12.5, 6.25 %</text><rect class="box" x="280" y="340" width="210" height="78" rx="6"/><text class="title" x="292" y="364">Envelope</text><text class="sub" x="292" y="386">G charges C4 via D1</text><text class="sub" x="292" y="402">decay pot, KILL on rest</text><rect class="box" x="280" y="480" width="210" height="78" rx="6"/><text class="title" x="292" y="504">Level  U24 U25</text><text class="sub" x="292" y="526">pulse switches buffered</text><text class="sub" x="292" y="542">envelope to the output</text><rect class="box" x="540" y="480" width="210" height="78" rx="6"/><text class="title" x="552" y="504">Amp  U26</text><text class="sub" x="552" y="526">LM386, gain 20</text><text class="sub" x="552" y="542">level pot, line out</text><rect class="box" x="800" y="480" width="210" height="78" rx="6"/><text class="title" x="812" y="504">Speaker</text><text class="sub" x="812" y="526">8 ohm</text><text class="sub" x="812" y="542">line out jack</text><text class="sub" x="20" y="600">Gate G (a key down, or the step edge on a note) opens the latch and charges the envelope. Every IC also takes VCC and GND.</text></svg>
